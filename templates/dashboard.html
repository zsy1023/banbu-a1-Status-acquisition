<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拓竹A1 打印机状态</title>

<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
    background: #0f172a; color: #e2e8f0;
    min-height: 100vh; padding: 20px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  h1 {
    font-size: 1.6rem; margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  h1 small { font-size: 0.8rem; color: #94a3b8; font-weight: normal; }
  /* 页头导航推到最右 */
  h1 > span:last-child { margin-left: auto; }

  .cards { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 14px; }
  .card {
    background: #1e293b; border-radius: 12px; padding: 16px;
    border: 1px solid #334155;
  }
  .card.full { grid-column: 1 / -1; }
  .card-title {
    font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em;
    color: #64748b; margin-bottom: 8px;
  }
  /* 卡片标题里的 SVG 图标 */
  .card-title .ico {
    width: 14px; height: 14px; vertical-align: -2px;
    margin-right: 6px; stroke-width: 2;
  }
  .card-title { display: flex; align-items: center; }
  /* 行内小图标（stat-label 前）*/
  .stat-label .ico {
    width: 13px; height: 13px; vertical-align: -2px;
    margin-right: 5px; opacity: 0.75; stroke-width: 2;
  }

  .status-badge {
    display: inline-block; padding: 4px 14px; border-radius: 20px;
    font-weight: 600; font-size: 0.9rem;
  }
  .status-idle { background: #334155; color: #94a3b8; }
  .status-printing { background: #166534; color: #bbf7d0; }
  .status-paused { background: #854d0e; color: #fef08a; }
  .status-finished { background: #1e40af; color: #bfdbfe; }
  .status-failed { background: #991b1b; color: #fecaca; }

  .progress-bar {
    width: 100%; height: 16px; background: #0f172a; border-radius: 8px;
    overflow: hidden; margin: 10px 0 6px;
  }
  .progress-fill {
    height: 100%; border-radius: 8px; transition: width 0.8s ease;
    background: linear-gradient(90deg, #22c55e, #16a34a);
  }
  .stat-row {
    display: flex; justify-content: space-between; padding: 4px 0;
    border-bottom: 1px solid #1e293b; font-size: 0.9rem;
  }
  .stat-row:last-child { border-bottom: none; }
  .stat-label { color: #94a3b8; }
  .stat-value { font-weight: 500; }

  .temp-grid {
    display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px;
  }
  .temp-item {
    text-align: center; padding: 10px; background: #0f172a;
    border-radius: 8px;
  }
  .temp-value { font-size: 1.5rem; font-weight: 700; }
  .temp-label { font-size: 0.75rem; color: #64748b; margin-top: 2px; }
  .temp-nozzle .temp-value { color: #f87171; }
  .temp-bed .temp-value { color: #fb923c; }
  .temp-chamber .temp-value { color: #38bdf8; }

  .ams-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 10px;
  }
  .ams-tray {
    background: #0f172a; border-radius: 8px; padding: 10px;
    text-align: center;
  }
  .ams-color-block {
    width: 32px; height: 32px; border-radius: 50%; margin: 0 auto 6px;
    border: 2px solid #334155;
  }
  .ams-tray-name { font-size: 0.8rem; color: #94a3b8; }

  .fan-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }

  .cover-img {
    max-width: 100%; max-height: 200px; border-radius: 8px;
    margin-top: 8px; object-fit: contain;
  }

  .login-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.95);
    display: none; align-items: center; justify-content: center;
    z-index: 100;
  }
  .login-box {
    background: #1e293b; padding: 32px; border-radius: 16px;
    width: 360px; border: 1px solid #334155;
  }
  .login-box h2 { margin-bottom: 16px; }
  .login-box input {
    width: 100%; padding: 10px; margin-bottom: 10px;
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #e2e8f0; font-size: 1rem;
  }
  .login-box button {
    width: 100%; padding: 10px; border: none; border-radius: 8px;
    background: #2563eb; color: white; font-size: 1rem; cursor: pointer;
    margin-bottom: 8px;
  }
  .login-box button:hover { background: #1d4ed8; }
  .login-box .btn-sms { background: #334155; }
  .login-box .btn-sms:hover { background: #475569; }
  .login-box .error { color: #f87171; font-size: 0.85rem; margin-top: 8px; }

  @media (max-width: 600px) {
    .cards { grid-template-columns: 1fr; }
    .temp-grid { grid-template-columns: 1fr; }
  }

  .loading {
    text-align: center; padding: 60px; color: #64748b;
  }
  .last-refresh {
    text-align: right; font-size: 0.75rem; color: #64748b; margin-top: 20px;
  }
  .toast {
    position: fixed; bottom: 20px; right: 20px;
    background: #1e293b; border: 1px solid #334155;
    padding: 12px 20px; border-radius: 8px; font-size: 0.85rem;
    display: none; z-index: 200;
  }

  .control-btn {
    background: #334155; color: #e2e8f0; border: 1px solid #475569;
    padding: 4px 12px; border-radius: 6px; cursor: pointer;
    font-size: 0.85rem; transition: background 0.2s;
  }
  .control-btn:hover { background: #475569; }
  .control-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .control-btn .ico-btn {
    width: 13px; height: 13px; vertical-align: -2px;
    margin-right: 4px; stroke-width: 2.2;
  }

  /* ── 页头 ── */
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand .logo {
    width: 30px; height: 30px; flex: 0 0 auto;
    padding: 5px; border-radius: 9px;
    color: #38bdf8; stroke-width: 1.8;
    background: linear-gradient(135deg, rgba(56,189,248,0.18), rgba(37,99,235,0.12));
    box-shadow: inset 0 0 0 1px rgba(56,189,248,0.25);
  }
  .nav-link {
    display: inline-flex; align-items: center; gap: 5px;
    color: #64748b; text-decoration: none;
    font-size: 0.8rem; padding: 5px 11px; border-radius: 8px;
    transition: background 0.2s, color 0.2s;
  }
  .nav-link:hover { background: #1e293b; color: #cbd5e1; }
  .nav-link .ico-nav {
    width: 14px; height: 14px; stroke-width: 2;
  }

  /* ── 灯光开关（一键直连）── */
  .light-row {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 6px 0;
  }
  .light-state {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 0.85rem; font-weight: 600;
    padding: 3px 10px; border-radius: 20px;
    transition: background 0.25s, color 0.25s, box-shadow 0.25s;
  }
  /* 状态圆点 */
  .light-state .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: currentColor; flex: 0 0 auto;
    transition: box-shadow 0.25s, background 0.25s;
  }
  .light-state.on .dot { box-shadow: 0 0 7px 1px rgba(253, 224, 71, 0.85); }
  .light-state.on {
    background: rgba(250, 204, 21, 0.16); color: #fde047;
    box-shadow: inset 0 0 0 1px rgba(250, 204, 21, 0.35);
  }
  .light-state.off {
    background: rgba(100, 116, 139, 0.18); color: #94a3b8;
    box-shadow: inset 0 0 0 1px rgba(100, 116, 139, 0.3);
  }
  .light-toggle {
    position: relative; width: 64px; height: 30px; flex: 0 0 auto;
    border: 1px solid #475569; border-radius: 999px;
    background: #0f172a; cursor: pointer; padding: 0;
    transition: background 0.25s, border-color 0.25s;
  }
  .light-toggle:hover:not(:disabled) { border-color: #64748b; }
  .light-toggle .knob {
    position: absolute; top: 3px; left: 3px;
    width: 22px; height: 22px; border-radius: 50%;
    background: #64748b; font-size: 12px; line-height: 22px;
    text-align: center; transition: left 0.25s, background 0.25s;
  }
  .light-toggle.on {
    background: linear-gradient(90deg, #a16207, #ca8a04);
    border-color: #eab308;
  }
  .light-toggle.on .knob {
    left: 37px; background: #fde047;
    box-shadow: 0 0 8px rgba(253, 224, 71, 0.7);
  }
  .light-toggle:disabled { opacity: 0.55; cursor: wait; }
  .light-toggle:disabled .knob { background: #94a3b8; }

  .confirm-overlay {
    position: fixed; inset: 0; background: rgba(15,23,42,0.92);
    display: none; align-items: center; justify-content: center;
    z-index: 150;
  }
  .confirm-box {
    background: #1e293b; padding: 24px; border-radius: 16px;
    width: 380px; border: 1px solid #334155;
  }
  .confirm-box h3 { margin-bottom: 8px; }
  .confirm-box p { color: #94a3b8; font-size: 0.9rem; margin-bottom: 16px; }
  .confirm-box .btn-row { display: flex; gap: 10px; }
  .confirm-box .btn-confirm {
    flex: 1; padding: 10px; border: none; border-radius: 8px;
    background: #2563eb; color: white; font-size: 1rem; cursor: pointer;
  }
  .confirm-box .btn-confirm:hover { background: #1d4ed8; }
  .confirm-box .btn-cancel {
    flex: 1; padding: 10px; border: 1px solid #475569; border-radius: 8px;
    background: transparent; color: #94a3b8; font-size: 1rem; cursor: pointer;
  }
  .confirm-box .btn-cancel:hover { background: #1e293b; color: #e2e8f0; }

  /* ── 暂停自动重试设置 ── */
  .retry-row {
    display: flex; align-items: center; gap: 8px;
    font-size: 0.95rem; padding: 6px 0; cursor: pointer;
  }
  .retry-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 8px 0; }
  .retry-grid label {
    font-size: 0.85rem; color: #94a3b8;
    display: flex; flex-direction: column; gap: 4px;
  }
  .retry-grid input {
    background: #0f172a; border: 1px solid #334155; border-radius: 8px;
    color: #e2e8f0; padding: 8px; font-size: 0.95rem;
  }
  .retry-reasons {
    display: grid; grid-template-columns: 1fr 1fr; gap: 2px;
    font-size: 0.85rem; max-height: 220px; overflow-y: auto;
  }
  .retry-reasons label {
    display: flex; align-items: center; gap: 6px;
    padding: 3px 0; cursor: pointer; color: #cbd5e1;
  }
</style>
</head>
<body>

<div class="container">
  <h1>
    <span class="brand">
      <svg class="ico logo" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9V3h12v6"/>
        <rect x="3" y="9" width="18" height="8" rx="2"/>
        <path d="M7 17v4h10v-4"/>
        <circle cx="17" cy="13" r="1"/>
      </svg>
      <span>拓竹A1</span>
    </span>
    <small id="serial"></small>
    <span style="font-size:0.8rem;display:flex;gap:4px;align-items:center">
      <a href="#" class="nav-link" onclick="showRetrySettings();return false">
        <svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="9"/>
          <rect x="9.5" y="9" width="5" height="7" rx="1"/>
        </svg>暂停重试</a>
      <a href="#" class="nav-link" onclick="showSettings();return false">
        <svg class="ico-nav" viewBox="0 0 24 24" fill="none" stroke="currentColor"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3"/>
          <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-2.9 1.2v.2a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.6 1.7 1.7 0 0 0-1.9.4l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0-1.2-2.9H3a2 2 0 1 1 0-4h.1A1.7 1.7 0 0 0 4.7 9a1.7 1.7 0 0 0-.4-1.9l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.9.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 2.9 1.2l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.9V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
        </svg>通知设置</a>
    </span>
  </h1>
  <div id="app" class="loading">⏳ 加载中...</div>
  <div class="last-refresh" id="lastRefresh"></div>
</div>

<!-- 登录弹窗 -->
<div id="loginOverlay" class="login-overlay">
  <div class="login-box">
    <h2>🔐 登录拓竹云</h2>
    <p style="color:#94a3b8;margin-bottom:12px;font-size:0.85rem">
      Token 已失效，请重新登录以获取打印机状态
    </p>
    <input type="text" id="loginPhone" placeholder="手机号">
    <button class="btn-sms" onclick="sendCode()">📨 发送验证码</button>
    <input type="text" id="loginCode" placeholder="验证码">
    <button onclick="doLogin()">登录</button>
    <div id="loginError" class="error"></div>
  </div>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>


<script>
// 从API获取手机号
let PHONE = "";

async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    ...opts
  });
  // 非 2xx 也尽量解析 JSON，好把后端的 error 原因带回给调用方
  const text = await res.text();
  if (!text) {
    return res.ok ? {} : {ok: false, error: 'HTTP ' + res.status};
  }
  try {
    return JSON.parse(text);
  } catch(e) {
    return {ok: false, error: 'HTTP ' + res.status + '：响应不是 JSON'};
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 3000);
}

function render(data) {
  const s = data;
  if (!s.connected) {
    document.getElementById('app').innerHTML =
      '<div style="text-align:center;padding:40px;color:#f87171">❌ 无法获取打印机状态</div>';
    return;
  }

  const stateCls = 'status-' + s.state;
  const stateLabels = { idle:'待机', printing:'打印中', paused:'暂停', finished:'已完成', failed:'失败' };
  const stateLabel = stateLabels[s.state] || s.state_raw;
  const pct = Math.round(s.progress.percent);
  const taskName = s.task.name || '无任务';
  const remain = s.time.remaining_min || 0;
  const remainStr = remain > 60
    ? Math.floor(remain/60) + 'h' + (remain%60) + 'min'
    : remain + 'min';

  const amsHtml = (s.ams || []).map(unit =>
    '<div style="margin-bottom:8px">' +
      '<div style="font-size:0.8rem;color:#64748b;margin-bottom:4px;display:flex;align-items:center;gap:5px">' +
        '<span style="display:inline-flex;color:#38bdf8">' + icon('droplet') + '</span>AMS ' + unit.id +
        ' · 湿度 ' + unit.humidity + '%</div>' +
      '<div class="ams-grid">' +
        (unit.trays || []).map(t =>
          '<div class="ams-tray">' +
            '<div class="ams-color-block" style="background:' + t.color + '"></div>' +
            '<div>' + t.type + '</div>' +
            '<div class="ams-tray-name">' + (t.color_name || t.color) + '</div>' +
          '</div>'
        ).join('') +
      '</div></div>'
  ).join('');

  document.getElementById('app').innerHTML =
    '<div class="cards">' +
      '<div class="card">' +
        cardTitle('activity', '状态') +
        '<div><span class="status-badge ' + stateCls + '">' + stateLabel + '</span></div>' +
        retryHintHtml(s) +
      '</div>' +
      '<div class="card">' +
        cardTitle('percent', '进度') +
        '<div style="font-size:1.8rem;font-weight:700">' + pct + '%</div>' +
        '<div class="progress-bar"><div class="progress-fill" style="width:' + pct + '%"></div></div>' +
        '<div style="font-size:0.85rem;color:#94a3b8">层 ' + s.progress.layer + ' / ' + s.progress.total_layers + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="cards">' +
      '<div class="card">' +
        cardTitle('thermo', '温度') +
        '<div class="temp-grid">' +
          '<div class="temp-item temp-nozzle"><div class="temp-value">' + s.temperature.nozzle.current + '°</div><div class="temp-label">喷头 → ' + s.temperature.nozzle.target + '°</div></div>' +
          '<div class="temp-item temp-bed"><div class="temp-value">' + s.temperature.bed.current + '°</div><div class="temp-label">热床 → ' + s.temperature.bed.target + '°</div></div>' +
          '<div class="temp-item temp-chamber"><div class="temp-value">' + s.temperature.chamber + '°</div><div class="temp-label">腔体</div></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        cardTitle('clock', '时间') +
        '<div class="stat-row"><span class="stat-label">' + icon('clock') + '剩余</span><span class="stat-value">' + remainStr + '</span></div>' +
        '<div class="stat-row"><span class="stat-label">' + icon('gauge') + '总时间</span><span class="stat-value">' + s.time.total_min + 'min</span></div>' +
        (s.task.weight_g ? '<div class="stat-row"><span class="stat-label">' + icon('scale') + '重量</span><span class="stat-value">' + s.task.weight_g + 'g</span></div>' : '') +
        '<div class="stat-row" style="border:none"><span class="stat-label">' + icon('wifi') + 'WiFi</span><span class="stat-value">' + s.hardware.wifi + '</span></div>' +
      '</div>' +
    '</div>' +
    '<div class="cards">' +
      '<div class="card full">' +
        cardTitle('file', '任务') +
        '<div style="font-size:1.1rem;font-weight:500">' + taskName + '</div>' +
        (s.task.cover_url ? '<img class="cover-img" src="' + s.task.cover_url + '" alt="预览" onerror="this.style.display=\'none\'">' : '') +
      '</div>' +
    '</div>' +
    '<div class="cards">' +
      '<div class="card">' +
        cardTitle('wind', '风扇') +
        '<div class="fan-grid">' +
          '<div class="stat-row"><span class="stat-label">冷却</span><span class="stat-value">' + s.fan.cooling + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">热端</span><span class="stat-value">' + s.fan.heatbreak + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">大风扇1</span><span class="stat-value">' + s.fan.big_fan1 + '</span></div>' +
          '<div class="stat-row"><span class="stat-label">大风扇2</span><span class="stat-value">' + s.fan.big_fan2 + '</span></div>' +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        cardTitle('cpu', '硬件') +
        '<div class="stat-row"><span class="stat-label">' + icon('nozzle') + '喷嘴</span><span class="stat-value">' + s.hardware.nozzle_diameter + 'mm ' + s.hardware.nozzle_type + '</span></div>' +
          '<div class="light-row">' +
            '<div><span class="stat-label">灯光</span> ' +
              lightStateHtml(_lightPending || s.hardware.light_mode) + '</div>' +
            '<button class="light-toggle' + ((_lightPending || s.hardware.light_mode) === 'on' ? ' on' : '') + '"' +
              ' id="lightToggle" onclick="toggleLight()" title="点击' +
              ((_lightPending || s.hardware.light_mode) === 'on' ? '关闭' : '打开') + '灯光">' +
              lightToggleHtml(_lightPending || s.hardware.light_mode) +
            '</button>' +
          '</div>' +
        '<div class="stat-row"><span class="stat-label">' + icon('gauge') + '速度</span><span class="stat-value">' + s.speed + '%</span>' +
          '<button class="control-btn" onclick="manualRefresh()">' + icon('refresh', 'ico-btn') + '刷新</button></div>' +
      '</div>' +
    '</div>' +
    (s.ams && s.ams.length ?
      '<div class="cards"><div class="card full">' + cardTitle('layers', 'AMS') + amsHtml + '</div></div>'
    : '') +

    '<div class="cards">' +
      '<div class="card full">' +
        cardTitle('list', '打印历史') +
        '<div id="printHistory"><div style="color:#64748b;font-size:0.85rem">加载中...</div></div>' +
      '</div>' +
    '</div>';
}

async function refresh() {
  try {
    const data = await api('/api/status');
    if (data.ok === false && data.error === '需要先登录') {
      openLoginOverlay();
      return;
    }
    render(data);
    if (data.last_refresh) {
      document.getElementById('lastRefresh').textContent = '上次刷新: ' + data.last_refresh;
    }
  } catch(e) {
    console.error(e);
  }
}

// 登录框为空时若 URL 带 ?login=1 但手机号还没拉取到，稍后重试一次
let _loginRetry = 0;

async function openLoginOverlay() {
  const overlay = document.getElementById('loginOverlay');
  const willOpen = overlay.style.display !== 'flex';
  overlay.style.display = 'flex';
  document.getElementById('app').innerHTML = '';
  // 仅首次打开时加载手机号，避免轮询反复请求
  const shouldLoadPhone = willOpen || !PHONE;
  if (!shouldLoadPhone) return;
  const cfg = await api('/api/config');
  if (cfg.phone) {
    document.getElementById('loginPhone').value = cfg.phone;
    PHONE = cfg.phone;
  } else if (!PHONE && _loginRetry < 3) {
    _loginRetry++;
    setTimeout(openLoginOverlay, 2000);
  }
}

// ── 图标（内联 SVG，统一线性风格）──────────────
// 统一 24x24 viewBox、currentColor 描边，颜色跟随文字自动适配主题
const ICONS = {
  activity:  '<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',
  percent:   '<line x1="19" y1="5" x2="5" y2="19"/><circle cx="6.5" cy="6.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/>',
  thermo:    '<path d="M14 14.76V3.5a2.5 2.5 0 0 0-5 0v11.26a4.5 4.5 0 1 0 5 0z"/>',
  clock:     '<circle cx="12" cy="12" r="9"/><polyline points="12 7 12 12 15.5 14"/>',
  file:      '<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>',
  wind:      '<path d="M9.6 4.6A2 2 0 1 1 11 8H2"/><path d="M12.6 19.4A2 2 0 1 0 14 16H2"/><path d="M17.7 7.7A2.5 2.5 0 1 1 19.5 12H2"/>',
  cpu:       '<rect x="4" y="4" width="16" height="16" rx="2"/><rect x="9" y="9" width="6" height="6"/><path d="M9 1v3M15 1v3M9 20v3M15 20v3M20 9h3M20 14h3M1 9h3M1 14h3"/>',
  layers:    '<polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/>',
  list:      '<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>',
  droplet:   '<path d="M12 2.7l5 5a7 7 0 1 1-10 0z"/>',
  wifi:      '<path d="M5 12.5a10 10 0 0 1 14 0"/><path d="M8.5 16a5 5 0 0 1 7 0"/><line x1="12" y1="19.5" x2="12.01" y2="19.5"/>',
  scale:     '<path d="M12 3v18"/><path d="M5 8h14"/><path d="M8 8l-3 6h6z"/><path d="M16 8l-3 6h6z"/>',
  nozzle:    '<path d="M6 4h12l-2 6H8z"/><path d="M11 10v4h2v-4"/><path d="M10 17h4v3h-4z"/>',
  gauge:     '<path d="M12 14l4-4"/><path d="M3.5 18a9 9 0 1 1 17 0"/>',
  refresh:   '<polyline points="21 4 21 10 15 10"/><path d="M20.5 14a8.5 8.5 0 1 1-2-8.9L21 8"/>',
};

function icon(name, cls) {
  const body = ICONS[name] || '';
  return '<svg class="' + (cls || 'ico') + '" viewBox="0 0 24 24" fill="none" ' +
         'stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">' +
         body + '</svg>';
}

// 卡片标题：图标 + 文字
function cardTitle(iconName, text) {
  return '<div class="card-title">' + icon(iconName) + '<span>' + text + '</span></div>';
}

// ── 灯光开关（一键直连，无二级确认）──────────
// 记录用户最后一次操作的目标状态，避免轮询回来的旧数据把按钮打回去
let _lightPending = null;      // 'on' | 'off' | null
let _lightBusy = false;

function lightStateHtml(mode) {
  const on = mode === 'on';
  return '<span class="light-state ' + (on ? 'on' : 'off') + '" id="lightState">' +
         '<i class="dot"></i>' + (on ? '已开启' : '已关闭') + '</span>';
}

function lightToggleHtml(mode) {
  const on = mode === 'on';
  // 圆钮内图标：开启时显示灯泡（SVG，小尺寸也清晰）
  const bulb = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" ' +
    'stroke-linecap="round" stroke-linejoin="round" style="width:12px;height:12px;' +
    'vertical-align:-2px;stroke-width:2.4">' +
    '<path d="M9 18h6"/><path d="M10 21h4"/>' +
    '<path d="M12 3a6 6 0 0 1 3.6 10.8c-.4.3-.6.8-.6 1.2H9c0-.4-.2-.9-.6-1.2A6 6 0 0 1 12 3z"/>' +
    '</svg>';
  return '<span class="knob">' + (on ? bulb : '') + '</span>';
}

// 不重绘整页，只更新按钮外观（避免轮询打断点击）
function applyLightUI(mode) {
  const btn = document.getElementById('lightToggle');
  if (btn) {
    btn.classList.toggle('on', mode === 'on');
    btn.title = '点击' + (mode === 'on' ? '关闭' : '打开') + '灯光';
    btn.innerHTML = lightToggleHtml(mode);
  }
  const state = document.getElementById('lightState');
  if (state) {
    state.className = 'light-state ' + (mode === 'on' ? 'on' : 'off');
    state.innerHTML = '<i class="dot"></i>' + (mode === 'on' ? '已开启' : '已关闭');
  }
}

async function toggleLight() {
  if (_lightBusy) return;
  const btn = document.getElementById('lightToggle');
  // 以当前界面显示的状态为准取反，保证「看到什么就切到什么」
  const currentBtnOn = btn ? btn.classList.contains('on') : false;
  const target = currentBtnOn ? 'off' : 'on';

  _lightBusy = true;
  _lightPending = target;
  if (btn) btn.disabled = true;
  applyLightUI(target);                       // 乐观更新：立刻反映点击结果

  try {
    const r = await api('/api/control', {
      method: 'POST',
      body: JSON.stringify({action: target === 'on' ? 'light_on' : 'light_off', direct: true})
    });
    if (r && r.ok) {
      const actual = (r.result && r.result.light_mode) || target;
      applyLightUI(actual);
      showToast(actual === 'on' ? '💡 灯光已打开' : '⚫ 灯光已关闭');
      _lightPending = null;
    } else {
      // 失败：回滚到点击前的样子
      applyLightUI(currentBtnOn ? 'on' : 'off');
      _lightPending = null;
      showToast('❌ ' + ((r && r.error) || '操作失败'));
    }
  } catch (e) {
    applyLightUI(currentBtnOn ? 'on' : 'off');
    _lightPending = null;
    showToast('❌ 请求失败：' + (e && e.message ? e.message : '未知错误'));
  } finally {
    _lightBusy = false;
    if (btn) btn.disabled = false;
  }
}

async function manualRefresh() {
  try {
    const r = await api('/api/refresh', {method: 'POST'});
    if (r.ok) {
      showToast('✅ 状态已刷新');
      refresh();
    } else {
      showToast('❌ ' + (r.error || '刷新失败'));
    }
  } catch(e) {
    showToast('❌ 刷新失败');
  }
}

async function sendCode() {
  // 注意：不要把输入框里的手机号当真实号发送。
  // /api/config 返回的是脱敏号（138****0000），直接发会被云端拒绝
  // （400 "Enter a valid phone number."）。因此只在用户明确改过号码时才传，
  // 否则留空让后端使用 config.json 里的真实号码。
  const input = document.getElementById('loginPhone').value.trim();
  const err = document.getElementById('loginError');
  const phone = (input && input.indexOf('*') === -1) ? input : '';
  err.textContent = '📨 发送中...';
  try {
    const r = await api('/api/send-code', {
      method: 'POST', body: JSON.stringify({phone})
    });
    // 请求已发出即视为成功，不看服务端返回码
    err.textContent = r && r.error ? ('❌ ' + r.error) : '✅ 验证码已发送，请查看手机短信';
  } catch(e) {
    err.textContent = '✅ 验证码已发送，请查看手机短信';
  }
}

async function doLogin() {
  // 同 sendCode：输入框里可能是脱敏号，带 * 时不传，让后端用配置里的真实号
  const input = document.getElementById('loginPhone').value.trim();
  const phone = (input && input.indexOf('*') === -1) ? input : '';
  const code = document.getElementById('loginCode').value.trim();
  const err = document.getElementById('loginError');
  if (!code) { err.textContent = '请输入验证码'; return; }
  err.textContent = '⏳ 登录中...';
  try {
    const r = await api('/api/login', {
      method: 'POST', body: JSON.stringify({phone, code})
    });
    if (r.ok) {
      document.getElementById('loginOverlay').style.display = 'none';
      err.textContent = '';
      document.getElementById('loginCode').value = '';
      showToast('✅ 登录成功');
      refresh();
    } else {
      err.textContent = '❌ ' + (r.error || '登录失败');
    }
  } catch(e) {
    err.textContent = '❌ 登录请求失败：' + (e && e.message ? e.message : '未知错误');
  }
}



// ── 打印历史 ──────────────────────────────
async function updateHistory() {
  const r = await api('/api/print-history?limit=10');
  if (!r.ok) return;
  const list = r.data || [];
  if (list.length === 0) {
    document.getElementById('printHistory').innerHTML = '<div style="color:#64748b;font-size:0.85rem">暂无打印记录</div>';
    return;
  }
  let html = '<div style="font-size:0.85rem">';
  for (const item of list) {
    const statusIcon = item.status === 'completed' ? '✅' : '❌';
    const start = (item.start_time || '').slice(0, 19).replace('T', ' ');
    const end = (item.end_time || '').slice(0, 19).replace('T', ' ');
    const dur = item.total_time_min ? item.total_time_min + 'min' : '-';
    html += '<div class="stat-row">' +
      '<span class="stat-label">' + statusIcon + ' ' + (item.task_name || '未知') + '</span>' +
      '<span class="stat-value">' + start + ' | ' + dur + '</span>' +
      '</div>';
  }
  html += '</div>';
  document.getElementById('printHistory').innerHTML = html;
}

// ── 自动刷新 ──────────────────────────────
// URL 带 ?login=1（由 token 失效提醒弹窗打开）时直接进入登录流程
const _openLoginOnLoad = new URLSearchParams(location.search).get('login') === '1';

refresh();
updateHistory();
if (_openLoginOnLoad) {
  openLoginOverlay();
  // 清理地址栏参数，避免之后手动刷新页面再次弹出
  try { history.replaceState(null, '', location.pathname); } catch(e) {}
}
setInterval(refresh, 15000);
setInterval(updateHistory, 60000);
</script>

<div id="settingsOverlay" class="confirm-overlay" style="display:none;z-index:160">
  <div class="confirm-box" style="width:500px;max-height:80vh;overflow-y:auto">
    <h3>🔔 通知规则设置</h3>
    <p style="color:#94a3b8;font-size:0.85rem;margin:4px 0 12px">
      规则触发后自动弹 Windows 通知，同一规则仅触发一次，下次打印时重置。
    </p>
    <div id="notifyRulesList"></div>
    <div style="margin-top:12px">
      <select id="newRuleType" style="background:#0f172a;color:#e2e8f0;border:1px solid #334155;border-radius:6px;padding:6px;width:100%;margin-bottom:8px">
        <option value="">+ 添加规则...</option>
      </select>
    </div>
    <div class="btn-row" style="margin-top:12px">
      <button class="btn-cancel" onclick="document.getElementById('settingsOverlay').style.display='none'">关闭</button>

    </div>
  </div>
</div>

<!-- 暂停自动重试设置弹窗 -->
<div id="retryOverlay" class="confirm-overlay" style="display:none;z-index:160">
  <div class="confirm-box" style="width:460px;max-height:85vh;overflow-y:auto">
    <h3>⏸️ 暂停自动重试</h3>
    <p style="color:#94a3b8;font-size:0.85rem;margin:4px 0 12px">
      打印暂停后自动发送「继续打印」指令恢复任务。只对下面勾选的原因生效，
      同一打印任务内最多重试指定次数。
    </p>

    <label class="retry-row">
      <input type="checkbox" id="retryEnabled">
      <span>启用自动重试</span>
    </label>

    <div class="retry-grid">
      <label>最多重试次数（1-10）
        <input type="number" id="retryMax" min="1" max="10" value="3">
      </label>
      <label>每次等待（10-1800 秒）
        <input type="number" id="retryDelay" min="10" max="1800" step="10" value="60">
      </label>
    </div>

    <div style="margin:10px 0 6px;color:#94a3b8;font-size:0.85rem">
      哪些原因自动重试：
      <a href="#" onclick="toggleAllRetryReasons(true);return false" style="color:#60a5fa">全选</a>
      <a href="#" onclick="toggleAllRetryReasons(false);return false" style="color:#60a5fa">全不选</a>
    </div>
    <div id="retryReasons" class="retry-reasons"></div>

    <div id="retryStatus" style="margin-top:10px;font-size:0.8rem;color:#64748b"></div>

    <div class="btn-row" style="margin-top:12px">
      <button class="btn-cancel" onclick="document.getElementById('retryOverlay').style.display='none'">关闭</button>
      <button class="btn-confirm" onclick="saveRetrySettings()">保存</button>
    </div>
  </div>
</div>

<script>
// ── 通知规则 ──────────────────────────────
let _notifyRuleTypes = [];
let _notifyRules = [];

async function showSettings() {
  const r = await api('/api/notify-rules');
  if (!r.ok) { showToast('❌ 加载规则失败'); return; }
  _notifyRuleTypes = r.types || [];
  _notifyRules = r.data || [];
  renderNotifySettings();
  document.getElementById('settingsOverlay').style.display = 'flex';
  
  // 填充选择框
  const sel = document.getElementById('newRuleType');
  sel.innerHTML = '<option value="">+ 添加规则...</option>';
  _notifyRuleTypes.forEach(t => {
    sel.innerHTML += '<option value="' + t.id + '">' + t.label + '</option>';
  });
}

function renderNotifySettings() {
  let html = '';
  _notifyRules.forEach((r, i) => {
    if (r.builtin) {
      html += '<div class="stat-row"><span class="stat-label">' + r.label + '</span><span class="stat-value" style="color:#64748b;font-size:0.75rem">内置</span></div>';
    } else {
      html += '<div class="stat-row">' +
        '<span class="stat-label">' + r.label + '</span>' +
        '<span><button class="control-btn" onclick="removeNotifyRule(&#39;' + r.id + '&#39;)">🗑️</button></span</span></div>';
    }
  });
  if (_notifyRules.filter(r => !r.builtin).length === 0) {
    html += '<div style="color:#64748b;font-size:0.85rem;padding:8px 0">暂无自定义规则，从下方添加</div>';
  }
  document.getElementById('notifyRulesList').innerHTML = html;
}

function addNotifyRule() {
  const sel = document.getElementById('newRuleType');
  const typeId = sel.value;
  if (!typeId) return;
  const t = _notifyRuleTypes.find(x => x.id === typeId);
  if (!t) return;
  
  const val = prompt('输入提醒值 (' + t.unit + ')', t.placeholder || '');
  if (val === null || val === '') return;
  
  // 生成唯一 id
  const id = 'rule_' + Date.now();
  const rule = {
    id: id,
    type: typeId,
    value: parseInt(val) || 0,
    enabled: true,
    label: t.label + ' (' + val + t.unit + ')',
  };
  // 处理区间格式: 30-40 → value=30, value2=40
  if (val && val.includes('-')) {
    const parts = val.split('-');
    rule.value = parseInt(parts[0]) || 0;
    rule.value2 = parseInt(parts[1]) || (parseInt(parts[0]) + 10);
    rule.label = t.label + ' (' + rule.value + '-' + rule.value2 + t.unit + ')';
  }
  _notifyRules.push(rule);
  renderNotifySettings();
}

async function saveNotifyRules() {
  const r = await api('/api/notify-rules', {
    method: 'POST',
    body: JSON.stringify({rules: _notifyRules})
  });
  if (r.ok) {
    showToast('✅ 规则已保存');
    document.getElementById('settingsOverlay').style.display = 'none';
  } else {
    showToast('❌ ' + (r.error || '保存失败'));
  }
}

function removeNotifyRule(id) {
  _notifyRules = _notifyRules.filter(r => r.builtin || r.id !== id);
  renderNotifySettings();
}

// Override the add button action
document.addEventListener('change', function(e) {
  if (e.target && e.target.id === 'newRuleType' && e.target.value) {
    addNotifyRule();
    e.target.value = '';
  }
});

// ── 暂停自动重试 ──────────────────────────
let _retryOptions = [];

function retryHintHtml(s) {
  const ar = s.auto_retry;
  if (!ar || !ar.enabled) return '';
  let t = '';
  if (ar.given_up) t = '已重试 ' + ar.count + '/' + ar.max + ' 次，已达上限停止';
  else if (ar.waiting) t = ar.remaining + ' 秒后自动重试（第 ' + (ar.count + 1) + '/' + ar.max + ' 次）';
  else if (ar.count) t = '本次打印已重试 ' + ar.count + '/' + ar.max + ' 次';
  return t ? '<div style="font-size:0.8rem;color:#94a3b8;margin-top:6px">⏸️ ' + t + '</div>' : '';
}

function retryStatusText(st) {
  if (!st.enabled) return '当前未启用';
  if (st.given_up) return '已重试 ' + st.count + '/' + st.max + ' 次，已达上限停止';
  if (st.waiting) return '等待中：' + st.remaining + ' 秒后重试（第 ' + (st.count + 1) + '/' + st.max + ' 次）';
  if (st.count) return '本次打印已重试 ' + st.count + '/' + st.max + ' 次';
  return '启用中，尚未触发重试';
}

async function showRetrySettings() {
  const r = await api('/api/retry-rules');
  if (!r.ok) { showToast('❌ 加载失败：' + (r.error || '')); return; }

  _retryOptions = r.options || [];
  const cfg = r.config || {};

  document.getElementById('retryEnabled').checked = !!cfg.enabled;
  document.getElementById('retryMax').value = cfg.max_retries || 3;
  document.getElementById('retryDelay').value = cfg.retry_delay || 60;

  const selected = new Set(cfg.reasons || []);
  document.getElementById('retryReasons').innerHTML = _retryOptions.map(o =>
    '<label><input type="checkbox" value="' + o.id + '"' +
    (selected.has(o.id) ? ' checked' : '') +
    '><span>' + o.label + '</span></label>'
  ).join('');

  document.getElementById('retryStatus').textContent = '状态：' + retryStatusText(r.status || {});
  document.getElementById('retryOverlay').style.display = 'flex';
}

function toggleAllRetryReasons(on) {
  document.querySelectorAll('#retryReasons input[type=checkbox]')
    .forEach(cb => { cb.checked = on; });
}

async function saveRetrySettings() {
  const reasons = Array.from(
    document.querySelectorAll('#retryReasons input[type=checkbox]:checked')
  ).map(cb => cb.value);

  const cfg = {
    enabled: document.getElementById('retryEnabled').checked,
    max_retries: parseInt(document.getElementById('retryMax').value, 10) || 3,
    retry_delay: parseInt(document.getElementById('retryDelay').value, 10) || 60,
    reasons: reasons,
  };

  if (cfg.enabled && reasons.length === 0) {
    showToast('❌ 请至少勾选一个需要自动重试的原因');
    return;
  }

  const r = await api('/api/retry-rules', {
    method: 'POST', body: JSON.stringify({config: cfg})
  });
  if (!r.ok) { showToast('❌ ' + (r.error || '保存失败')); return; }

  document.getElementById('retryStatus').textContent = '状态：' + retryStatusText(r.status || {});
  showToast('✅ 暂停重试设置已保存' + (r.config && r.config.enabled ? '' : '（未启用）'));
  document.getElementById('retryOverlay').style.display = 'none';
  refresh();
}
</script>
